<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Octane Vault - Intro</title>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #050505;
                background-image: radial-gradient(at 50% 50%, #200000 0, #000 70%);
                color: #fff;
                font-family: 'Segoe UI', sans-serif;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                margin: 0;
                overflow: hidden;
            }

            h1 {
                font-family: 'Orbitron', sans-serif;
                font-size: 5rem;
                margin-bottom: 0.5rem;
                color: #ff003c;
                text-shadow: 0 0 20px rgba(255, 0, 60, 0.6);
                animation: glow 3s infinite alternate;
            }

            .text-white {
                color: #fff;
            }

            .details {
                font-size: 1.2rem;
                color: #ccc;
                line-height: 1.6;
                background: rgba(20, 20, 20, 0.6);
                padding: 2rem 4rem;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                backdrop-filter: blur(10px);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
                margin-bottom: 3rem;
                min-width: 400px;
            }

            .details p {
                margin: 0.5rem 0;
            }

            strong {
                color: #ff003c;
            }

            /* Enter Button */
            .btn-enter {
                display: inline-block;
                padding: 1rem 3rem;
                border: 2px solid #ff003c;
                color: #ff003c;
                text-decoration: none;
                font-family: 'Orbitron', sans-serif;
                font-size: 1.5rem;
                letter-spacing: 3px;
                transition: all 0.3s;
                background: transparent;
                position: relative;
                overflow: hidden;
            }

            .btn-enter:hover {
                background: #ff003c;
                color: #000;
                box-shadow: 0 0 30px #ff003c;
            }

            @keyframes glow {
                from {
                    text-shadow: 0 0 10px #ff003c;
                }

                to {
                    text-shadow: 0 0 30px #ff003c;
                    filter: brightness(1.2);
                }
            }
        </style>
    </head>

    <body>

        <h1>OCTANE<span class="text-white">VAULT</span></h1>
        <h3 style="color: #666; margin-bottom: 2rem; letter-spacing: 4px; font-weight: 400;">CS50 FINAL PROJECT</h3>

        <div class="details">
            <p><strong>Name:</strong> BAVISH REDDY</p>
            <p><strong>GitHub:</strong> bavish007</p>
            <p><strong>edX:</strong> bavish_1</p>
            <p><strong>Location:</strong> Hyderabad, India</p>
            <p><strong>Date:</strong> 30 December 2025</p>
        </div>

        <a href="/" class="btn-enter">ENTER SYSTEM</a>

    </body>

</html>
