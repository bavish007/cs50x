<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <link href="/static/styles.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

        <title>Octane Vault: {% block title %}{% endblock %}</title>
    </head>

    <body class="d-flex flex-column min-vh-100">

        <nav class="navbar navbar-expand-md navbar-dark mb-4 sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand text-danger" href="/" style="font-family: 'Orbitron', sans-serif;">
                    OCTANE<span class="text-white">VAULT</span>
                </a>

                {% if session["user_id"] %}
                    <span class="badge bg-black {{ rank_color }} ms-2 d-none d-md-inline-block" style="font-size: 0.7rem; letter-spacing: 1px;">
                        STATUS: {{ user_rank }}
                    </span>
                {% endif %}

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbar">
                    {% if session["user_id"] %}
                        <ul class="navbar-nav me-auto mt-2 ms-3">
                            <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                            <li class="nav-item"><a class="nav-link" href="/add">Acquire</a></li>
                            <li class="nav-item"><a class="nav-link text-warning" href="/leaderboard">🏆 Rankings</a></li>
                        </ul>
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link text-secondary" href="/logout">Sign Out</a></li>
                        </ul>
                    {% else %}
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                            <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                        </ul>
                    {% endif %}
                </div>
            </div>
        </nav>

        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000">
            <div id="liveToast" class="toast bg-dark text-white border-secondary" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header bg-black text-white border-secondary">
                    <strong class="me-auto text-danger">System Alert</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body" id="toastMessage"></div>
            </div>
        </div>

        <main class="container py-4 flex-grow-1">
            {% block main %}{% endblock %}
        </main>

        <footer class="mt-auto py-4 text-center">
            <p class="mb-0 small text-secondary">&copy; 2025 Octane Vault. Authorized Access Only.</p>
        </footer>

        <script>
            // Helper function to show notifications from anywhere
            function showToast(message) {
                const toastEl = document.getElementById('liveToast');
                const toastBody = document.getElementById('toastMessage');
                if (toastEl && toastBody) {
                    toastBody.innerText = message;
                    const toast = new bootstrap.Toast(toastEl);
                    toast.show();
                }
            }
        </script>
    </body>

</html>
